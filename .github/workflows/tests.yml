name: tests

on:
  push:
    branches: [1.x]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        # Each Laravel major only on the PHP versions it supports
        # (laravel.com/docs/13.x/releases#support-policy):
        # 11 on 8.2-8.4, 12 on 8.2-8.5, 13 on 8.3-8.5.
        exclude:
          - laravel: '11.*'
            php: '8.5'
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    # PHP 8.5 is new to this suite: report it, do not block on it, until it has gone green once.
    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pdo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress --with-all-dependencies --no-audit

      - name: Run the test suite
        run: vendor/bin/phpunit

  lowest:
    # Informational: proves the lowest versions composer.json allows still work.
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Lowest dependencies (PHP 8.2 / Laravel 11)

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo
          coverage: none

      - name: Install lowest dependencies
        run: composer update --prefer-dist --prefer-lowest --no-interaction --no-progress --with-all-dependencies --no-audit

      - name: Run the test suite
        run: vendor/bin/phpunit

  static:
    runs-on: ubuntu-latest
    name: Code style and static analysis
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  validate:
    runs-on: ubuntu-latest
    name: composer.json is valid
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
